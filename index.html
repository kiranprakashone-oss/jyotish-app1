<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vedic Jyotish Analysis Engine - Sripati Bhava Chalit</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151c2c;
            --accent-primary: #6366f1;
            --accent-hover: #4f46e5;
            --accent-light: #818cf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #26334d;
            --error-color: #ef4444;
            --error-bg: rgba(239, 68, 68, 0.1);
            --success-color: #10b981;
            --success-bg: rgba(16, 185, 129, 0.1);
            --step-bg: rgba(99, 102, 241, 0.08);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 24px 16px;
            display: flex;
            justify-content: center;
            line-height: 1.5;
        }

        .container {
            width: 100%;
            max-width: 720px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(99, 102, 241, 0.05);
        }

        h1 {
            margin: 0 0 8px 0;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            background: linear-gradient(135deg, #ffffff 0%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h2 {
            margin: 0 0 14px 0;
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--accent-light);
        }

        label {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            display: block;
            font-weight: 500;
        }

        textarea {
            width: 100%;
            background-color: rgba(11, 15, 25, 0.7);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            box-sizing: border-box;
            font-size: 0.95rem;
            margin-bottom: 14px;
            padding: 12px;
            resize: vertical;
            outline: none;
        }

        textarea:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        #chartDataInput {
            height: 110px;
        }

        #prompt {
            height: 90px;
        }

        button {
            position: relative;
            z-index: 10;
            width: 100%;
            padding: 12px 16px;
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-hover) 100%);
            color: #ffffff;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.95rem;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
            pointer-events: auto !important;
        }

        button:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4);
        }

        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            box-shadow: none;
        }

        .status {
            font-size: 0.85rem;
            margin-top: 6px;
            padding: 10px 14px;
            border-radius: 8px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: #10b981;
            font-weight: 500;
        }

        .matrix-box {
            background-color: rgba(11, 15, 25, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 16px;
            font-family: monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
            color: #e2e8f0;
            margin: 14px 0;
            max-height: 300px;
            overflow-y: auto;
        }

        .consent-box {
            display: none;
            margin-top: 16px;
            padding: 16px;
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 10px;
        }

        .progress-inspector {
            background-color: rgba(99, 102, 241, 0.08);
            border: 1px dashed var(--accent-primary);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 14px;
            font-family: monospace;
            font-size: 0.82rem;
            color: var(--accent-light);
        }

        .progress-step {
            margin-bottom: 8px;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .token-badge {
            margin-top: 14px;
            padding: 10px 14px;
            background-color: rgba(99, 102, 241, 0.12);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 8px;
            font-size: 0.85rem;
            color: var(--accent-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #output {
            white-space: pre-wrap;
            line-height: 1.6;
            font-size: 0.95rem;
            color: #e2e8f0;
            margin-top: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1>Vedic Jyotish Analysis Engine</h1>
        <div id="memoryStatus" class="status">Chart Memory: No chart baseline stored in session yet.</div>
    </div>

            <div id="matrixOutput" class="matrix-box"></div>
