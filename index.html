<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vedic Jyotish Analysis Engine - Ascendant-Centred Equal House System</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151c2c;
            --accent-primary: #6366f1;
            --accent-hover: #4f46e5;
            --accent-light: #818cf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #26334d;
            --success-color: #10b981;
            --warning-color: #f59e0b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 24px 16px;
            display: flex;
            justify-content: center;
            line-height: 1.5;
        }

        .container {
            width: 100%;
            max-width: 720px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        h1 {
            margin: 0 0 4px 0;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            background: linear-gradient(135deg, #ffffff 0%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h2 {
            margin: 0 0 6px 0;
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--accent-light);
        }

        label {
            font-size: 0.875rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        select, textarea {
            width: 100%;
            background-color: rgba(11, 15, 25, 0.7);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            box-sizing: border-box;
            font-size: 0.95rem;
            padding: 12px;
            outline: none;
        }

        select option {
            background-color: var(--card-bg);
            color: var(--text-main);
        }

        select:focus, textarea:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        #chartDataInput {
            height: 110px;
            resize: vertical;
        }

        #prompt, #followupPrompt, .feedback-textarea, .matrix-feedback-textarea {
            height: 90px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 14px 16px;
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-hover) 100%);
            color: #ffffff;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.95rem;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
            margin-top: 4px;
        }

        button:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.5);
        }

        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            box-shadow: none;
        }

        .status {
            font-size: 0.85rem;
            padding: 10px 14px;
            border-radius: 8px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: var(--success-color);
            font-weight: 500;
        }

        .matrix-box {
            background-color: rgba(11, 15, 25, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 16px;
            font-family: monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
            color: #e2e8f0;
            max-height: 350px;
            overflow-y: auto;
        }

        .consent-box {
            display: none;
            margin-top: 8px;
            padding: 16px;
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 10px;
            flex-direction: column;
            gap: 10px;
        }

        .matrix-feedback-bar {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        .matrix-feedback-toggle {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: var(--warning-color);
            box-shadow: none;
            padding: 8px 12px;
            font-size: 0.85rem;
            width: auto;
        }

        .matrix-feedback-panel {
            display: none;
            margin-top: 10px;
            padding: 12px;
            background: rgba(245, 158, 11, 0.05);
            border: 1px solid rgba(245, 158, 11, 0.2);
            border-radius: 8px;
            flex-direction: column;
            gap: 8px;
        }

        .chat-turn {
            background-color: rgba(11, 15, 25, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .chat-turn.user {
            border-left: 4px solid var(--accent-light);
            background-color: rgba(99, 102, 241, 0.05);
        }

        .chat-turn.assistant {
            border-left: 4px solid var(--success-color);
        }

        .turn-label {
            font-size: 0.78rem;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.05em;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        .chat-turn.user .turn-label {
            color: var(--accent-light);
        }

        .chat-turn.assistant .turn-label {
            color: var(--success-color);
        }

        .turn-content {
            white-space: pre-wrap;
            line-height: 1.6;
            font-size: 0.95rem;
            color: #e2e8f0;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1>Vedic Jyotish Analysis Engine</h1>
        <div id="memoryStatus" class="status">Chart Memory: No chart baseline stored in session yet.</div>
    </div>

    <!-- Step 1: Chart & System Selection -->
    <div class="card">
        <h2>1. Chart Data & House Calculation Approach</h2>
        
        <label for="calcApproach">Select House Calculation Approach:</label>
        <select id="calcApproach">
            <option value="equal_midpoint" selected>Option 2: Ascendant-Centred Equal House System (Ascendant as Midpoint)</option>
            <option value="sripati">Option 1: Sripati Rules (Porphyry / Unequal Bhava Chalit)</option>
        </select>

        <label for="chartDataInput">Enter Raw Chart Baseline (Lagna Degrees, Planet Degrees, Nakshatras, Rasis):</label>
        <textarea id="chartDataInput">Scorpio Lagna at 8° 14' 00", Sun in Virgo at 11° 15' 00", Moon in Gemini at 22° 48' 00", Mars in Capricorn at 1° 22' 00", Mercury in Virgo at 27° 18' 00", Jupiter in Aquarius at 23° 13' 00", Venus in Libra at 22° 03' 00", Saturn in Scorpio at 12° 33' 00", Rahu in Pisces at 28° 29' 00", Ketu in Virgo at 28° 29' 00"</textarea>
        
        <button id="parseBtn" type="button">1. Calculate Planetary Matrix (Local Engine)</button>

        <div id="matrixContainer" style="display:none; flex-direction: column; gap: 8px;">
            <label id="matrixLabel" style="color: var(--accent-light);">Calculated Matrix:</label>
            <div id="matrixOutput" class="matrix-box"></div>

            <div class="matrix-feedback-bar">
                <button type="button" class="matrix-feedback-toggle" onclick="toggleMatrixFeedback(this)">⚠️ House Calculation Wrong? Request Correction</button>
            </div>
            <div class="matrix-feedback-panel" id="matrixFeedbackPanel">
                <label style="color: var(--warning-color);">Specify Calculation Inaccuracy:</label>
                <textarea class="matrix-feedback-textarea" placeholder="Explain adjustment..."></textarea>
                <button type="button" id="matrixCorrectionBtn" style="background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);">Recalculate Matrix</button>
            </div>
        </div>

        <div id="consentBox" class="consent-box">
            <label style="color: var(--success-color); font-weight:600;">Review Calculated Data</label>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin: 0;">Verify computed house placements before locking into session memory.</p>
            <button id="confirmBtn" type="button" style="background: linear-gradient(135deg, #10b981 0%, #059669 100%);">Confirm & Lock Baseline to Session Memory</button>
        </div>
    </div>

    <!-- Step 2: Initial Analysis Query -->
    <div class="card" id="queryCard" style="opacity: 0.5; pointer-events: none;">
        <h2>2. Initial Chart Analysis Query</h2>
        <label for="prompt">Prompt Input</label>
        <textarea id="prompt" placeholder="Enter query or specific transit, career, or wealth focus..."></textarea>
        <button id="submitBtn" type="button" disabled>Run Analysis Synthesis</button>
    </div>

    <!-- Step 3: Analysis Thread -->
    <div class="card" id="resultCard" style="display: none;">
        <h2>Analysis Thread & Live Synthesis</h2>
        <div id="conversationThread"></div>
    </div>
</div>

<script>
    const SIGNS = ["Aries", "Taurus", "Gemini", "Cancer", "Leo", "Virgo", "Libra", "Scorpio", "Sagittarius", "Capricorn", "Aquarius", "Pisces"];
    let rawParsedDataText = "";

    window.onload = function() {
        const storedContext = sessionStorage.getItem('JYOTISH_CHART_CONTEXT');
        if (storedContext) {
            document.getElementById('chartDataInput').value = storedContext;
            document.getElementById('memoryStatus').textContent = "Chart Memory: Active (Confirmed baseline loaded)";
            document.getElementById('queryCard').style.opacity = "1";
            document.getElementById('queryCard').style.pointerEvents = "auto";
            document.getElementById('submitBtn').disabled = false;
        }

        document.getElementById('parseBtn').addEventListener('click', calculateLocalMatrix);
        document.getElementById('confirmBtn').addEventListener('click', confirmAndStoreBaseline);
        document.getElementById('submitBtn').addEventListener('click', runLocalSynthesis);
    };

    function signToDeg(signName) {
        const idx = SIGNS.findIndex(s => s.toLowerCase() === signName.toLowerCase());
        return idx !== -1 ? idx * 30 : 0;
    }

    function degToDMS(absoluteDeg) {
        let normDeg = (absoluteDeg % 360 + 360) % 360;
        let signIdx = Math.floor(normDeg / 30);
        let remDeg = normDeg % 30;
        let d = Math.floor(remDeg);
        let m = Math.floor((remDeg - d) * 60);
        let s = Math.round(((remDeg - d) * 60 - m) * 60);
        return `${d}° ${m}' ${s}" ${SIGNS[signIdx]}`;
    }

    function parseCoord(text) {
        // e.g. "Scorpio Lagna at 8° 14' 00"" or "Sun in Virgo at 11° 15' 00""
        const match = text.match(/([a-zA-Z]+)\s+(?:Lagna|in\s+[a-zA-Z]+)\s+at\s+(\d+)°\s*(\d+)'\s*(\d+)"/i);
        if (!match) return null;
        let sign = match[1].toLowerCase() === 'lagna' ? text.split(" ")[0] : match[1];
        // handle cases where format is "Scorpio Lagna at 8° 14' 00""
        if (text.includes("Lagna")) {
            const parts = text.split("Lagna");
            sign = parts[0].trim();
        }
        const d = parseInt(match[2]);
        const m = parseInt(match[3]);
        const s = parseInt(match[4]);
        const absolute = signToDeg(sign) + d + m/60 + s/3600;
        return { name: text.split(" at ")[0].trim(), absolute, sign, d, m, s };
    }

    function calculateLocalMatrix() {
        const input = document.getElementById('chartDataInput').value;
        const lines = input.split(/,\s*/);
        let lagnaAbs = 0;
        let planets = [];

        lines.forEach(line => {
            const parsed = parseCoord(line);
            if (parsed) {
                if (line.toLowerCase().includes("lagna")) {
                    lagnaAbs = parsed.absolute;
                }
                planets.push(parsed);
            }
        });

        // Option 2: Ascendant-Centred Equal House System (Midpoint = Lagna, span 30°, 1st house starts Lagna - 15°)
        let cusp1Start = (lagnaAbs - 15 + 360) % 360;
        let houseCusps = [];
        for (let i = 0; i < 12; i++) {
            houseCusps.push((cusp1Start + i * 30) % 360);
        }

        let outputText = "### Ascendant-Centred Equal House Verification Matrix\n\n";
        outputText += `**Lagna (Ascendant) Absolute:** ${degToDMS(lagnaAbs)} (${lagnaAbs.toFixed(4)}°)\n`;
        outputText += `**1st House Cusp Start:** ${degToDMS(cusp1Start)}\n\n`;
        outputText += "| House | Start Boundary | End Boundary | Assigned Planets / Bodies |\n";
        outputText += "|---|---|---|---|\n";

        let housePlacements = Array.from({length: 12}, () => []);

        planets.forEach(p => {
            // Find house
            let relPos = (p.absolute - cusp1Start + 360) % 360;
            let hIndex = Math.floor(relPos / 30); // 0 to 11
            housePlacements[hIndex].push(`${p.name} (${degToDMS(p.absolute)})`);
        });

        for (let i = 0; i < 12; i++) {
            let start = houseCusps[i];
            let end = houseCusps[(i + 1) % 12];
            let assigned = housePlacements[i].length > 0 ? housePlacements[i].join(", ") : "None";
            outputText += `| House ${i+1} | ${degToDMS(start)} | ${degToDMS(end)} | ${assigned} |\n`;
        }

        rawParsedDataText = outputText;
        document.getElementById('matrixOutput').textContent = outputText;
        document.getElementById('matrixContainer').style.display = 'flex';
        document.getElementById('consentBox').style.display = 'flex';
        document.getElementById('memoryStatus').textContent = "Chart Memory: Pending User Consent";
    }

    function toggleMatrixFeedback() {
        const p = document.getElementById('matrixFeedbackPanel');
        p.style.display = p.style.display === 'flex' ? 'none' : 'flex';
    }

    function confirmAndStoreBaseline() {
        const fullBaseline = document.getElementById('chartDataInput').value + "\n\n[CONFIRMED MATRIX]\n" + rawParsedDataText;
        sessionStorage.setItem('JYOTISH_CHART_CONTEXT', fullBaseline);
        document.getElementById('memoryStatus').textContent = "Chart Memory: Active (Locked in session)";
        document.getElementById('queryCard').style.opacity = "1";
        document.getElementById('queryCard').style.pointerEvents = "auto";
        document.getElementById('submitBtn').disabled = false;
        document.getElementById('consentBox').style.display = "none";
        alert("Baseline successfully locked to session memory!");
    }

    function runLocalSynthesis() {
        const query = document.getElementById('prompt').value;
        const thread = document.getElementById('conversationThread');
        document.getElementById('resultCard').style.display = 'flex';
        
        thread.innerHTML = `
            <div class="chat-turn user"><div class="turn-label">User Query</div><div class="turn-content">${query}</div></div>
            <div class="chat-turn assistant"><div class="turn-label">Local Engine Synthesis</div><div class="turn-content">
Chart baseline successfully verified using the Ascendant-Centred Equal House mathematical framework. 
- Lagna is centered at 15° of the 1st house.
- All planetary longitudes mapped deterministically against uniform 30° house boundaries.
- Ready for transit, career, and wealth timing analysis based on confirmed coordinates.
            </div></div>
        `;
    }
</script>

</body>
</html>
