<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vedic Jyotish Analysis Engine</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151c2c;
            --accent-primary: #6366f1;
            --accent-hover: #4f46e5;
            --accent-light: #818cf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #26334d;
            --error-color: #ef4444;
            --error-bg: rgba(239, 68, 68, 0.1);
            --success-color: #10b981;
            --success-bg: rgba(16, 185, 129, 0.1);
            --step-bg: rgba(99, 102, 241, 0.08);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 24px 16px;
            display: flex;
            justify-content: center;
            line-height: 1.5;
        }

        .container {
            width: 100%;
            max-width: 640px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(99, 102, 241, 0.05);
            transition: border-color 0.2s;
        }

        .card:hover {
            border-color: rgba(99, 102, 241, 0.4);
        }

        h1 {
            margin: 0 0 8px 0;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            background: linear-gradient(135deg, #ffffff 0%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h2 {
            margin: 0 0 14px 0;
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--accent-light);
        }

        label {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            display: block;
            font-weight: 500;
        }

        select, textarea {
            width: 100%;
            background-color: rgba(11, 15, 25, 0.7);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-main);
            box-sizing: border-box;
            font-size: 0.95rem;
            margin-bottom: 14px;
            padding: 12px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        select option {
            background-color: var(--card-bg);
            color: var(--text-main);
        }

        select:focus, textarea:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        #chartDataInput {
            height: 110px;
        }

        #prompt {
            height: 90px;
        }

        button {
            width: 100%;
            padding: 12px 16px;
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-hover) 100%);
            color: #ffffff;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.95rem;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
            transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
        }

        button:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            box-shadow: none;
        }

        .status {
            font-size: 0.85rem;
            margin-top: 6px;
            padding: 10px 14px;
            border-radius: 8px;
            background: var(--success-bg);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: var(--success-color);
            font-weight: 500;
        }

        .progress-inspector {
            background-color: var(--step-bg);
            border: 1px dashed var(--accent-primary);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 14px;
            font-family: monospace;
            font-size: 0.82rem;
            color: var(--accent-light);
            display: none;
        }

        .progress-step {
            margin-bottom: 8px;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .progress-step.active::before {
            content: "⏳";
            animation: pulse 1s infinite;
        }

        .progress-step.done::before {
            content: "✅";
        }

        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        #output {
            white-space: pre-wrap;
            line-height: 1.6;
            font-size: 0.95rem;
            color: #e2e8f0;
        }

        .error-message {
            color: var(--error-color);
            background: var(--error-bg);
            border: 1px solid rgba(239, 68, 68, 0.2);
            padding: 14px;
            border-radius: 8px;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1>Vedic Jyotish Analysis Engine</h1>
        <div id="memoryStatus" class="status">Chart Memory: No chart baseline stored in session yet.</div>
    </div>

    <div class="card">
        <h2>1. Enter Chart Baseline Data</h2>
        <label for="chartDataInput">Enter Lagna, planetary degrees, Nakshatras, and Rasis:</label>
        <textarea id="chartDataInput" placeholder="Example: Scorpio Lagna 8°14' (Anuradha Pada 2), Saturn 12°33' in Scorpio, Exalted Mars 1°22' in Capricorn..."></textarea>
        <button id="saveBtn" onclick="saveChartBaseline()">Save Chart Baseline to Memory</button>
    </div>

    <div class="card">
        <h2>2. Chart Analysis Query</h2>
        <label for="modelSelect">Select AI Model Engine</label>
        <select id="modelSelect">
            <option value="llama">Meta Llama 3.1 8B (Primary / Edge AI)</option>
            <option value="gemini">Google Gemini (Secondary / Fallback)</option>
        </select>

        <label for="prompt">Prompt Input (Synthesizes using Analysis Approach & stored chart memory)</label>
        <textarea id="prompt" placeholder="Enter query or specific transit, career, or wealth focus..."></textarea>
        <button id="submitBtn" onclick="processQuery()">Run Synthesis</button>
    </div>

    <div class="card" id="resultCard" style="display: none;">
        <h2>Analysis Approach & Handshake Inspector</h2>
        <div id="progressInspector" class="progress-inspector">
            <div id="step1" class="progress-step">Initializing workflow...</div>
            <div id="step2" class="progress-step" style="display:none;"></div>
            <div id="step3" class="progress-step" style="display:none;"></div>
            <div id="step4" class="progress-step" style="display:none;"></div>
        </div>
        <div id="output"></div>
    </div>
</div>

<script>
    const WORKER_URL = "https://jyotish-api-gateway.kiranprakashone.workers.dev";

    window.onload = function() {
        const storedContext = sessionStorage.getItem('JYOTISH_CHART_CONTEXT');
        if (storedContext) {
            document.getElementById('chartDataInput').value = storedContext;
            document.getElementById('memoryStatus').textContent = "Chart Memory: Active (Planetary baseline stored in session)";
        }
    };

    function saveChartBaseline() {
        const chartData = document.getElementById('chartDataInput').value.trim();
        const memoryStatus = document.getElementById('memoryStatus');
        const outputDiv = document.getElementById('output');
        const resultCard = document.getElementById('resultCard');
        const inspector = document.getElementById('progressInspector');

        if (!chartData) {
            alert("Please provide chart baseline text before saving.");
            return;
        }

        sessionStorage.setItem('JYOTISH_CHART_CONTEXT', chartData);
        memoryStatus.textContent = "Chart Memory: Active (Planetary baseline stored in session)";
        
        inspector.style.display = "none";
        resultCard.style.display = "block";
        outputDiv.className = "";
        outputDiv.textContent = "--- CHART BASELINE SUCCESSFULLY SAVED TO SESSION MEMORY ---\n\n" + chartData;
    }

    function getAnalysisApproachPrompt() {
        return `[SYSTEM INSTRUCTION: VEDIC JYOTISH ANALYSIS APPROACH]
You are an expert Vedic astrologer. Evaluate the user query using the following 7-Rule framework:
1. Lagna Framework: Structural foundation and house lord dispositions.
2. Bhava Madhya: Exact house midpoint boundaries and occupancy.
3. Planetary Placement: Dignities, Nakshatras, Padas, and Navamsa placements.
4. Multi-Dasha Matrix: Synchronize Vimshottari, Chara, and Yogini dashas.
5. Transit Overlay: Dual Reference Frame (Lagna & Chandra Lagna transits).
6. Aspect Geometry: Parashari aspects and Gandanta boundary checks.
7. Concise Synthesis: Final conclusion addressing user focus.

[RESPONSE FORMAT MANDATE FOR SPEED]
- Be direct, highly structured, and concise (under 350 words total).
- Focus specifically on the rules most relevant to the user query.
- Use concise bullet points; omit conversational filler.`;
    }

    async function processQuery() {
        const userPrompt = document.getElementById('prompt').value.trim();
        const selectedModel = document.getElementById('modelSelect').value;
        const submitBtn = document.getElementById('submitBtn');
        const outputDiv = document.getElementById('output');
        const resultCard = document.getElementById('resultCard');
        const inspector = document.getElementById('progressInspector');

        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');
        const step3 = document.getElementById('step3');
        const step4 = document.getElementById('step4');

        if (!userPrompt) {
            alert("Please provide input query parameters for analysis.");
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Synthesizing Analysis Approach...";
        resultCard.style.display = "block";
        inspector.style.display = "block";
        outputDiv.className = "";
        outputDiv.textContent = "";

        step1.style.display = "flex";
        step2.style.display = "none";
        step3.style.display = "none";
        step4.style.display = "none";

        try {
            step1.className = "progress-step active";
            step1.textContent = "Step 1/4: Retrieving stored Natal Chart Baseline from session memory...";
            await new Promise(r => setTimeout(r, 200));

            const storedChartContext = sessionStorage.getItem('JYOTISH_CHART_CONTEXT') || "No prior chart baseline entered.";
            step1.className = "progress-step done";
            step1.textContent = "Step 1/4: Natal chart baseline successfully loaded.";

            step2.style.display = "flex";
            step2.className = "progress-step active";
            step2.textContent = "Step 2/4: Loading refined Analysis Approach (Concise 7-Rule speed protocol)...";
            await new Promise(r => setTimeout(r, 250));
            step2.className = "progress-step done";
            step2.textContent = "Step 2/4: Concise Analysis Approach rules embedded into prompt structure.";

            step3.style.display = "flex";
            step3.className = "progress-step active";
            step3.textContent = `Step 3/4: Compiling fast prompt for model (${selectedModel.toUpperCase()})...`;
            await new Promise(r => setTimeout(r, 200));

            const analysisApproachText = getAnalysisApproachPrompt();
            const combinedPrompt = `${analysisApproachText}\n\n[NATAL CHART BASELINE MEMORY]\n${storedChartContext}\n\n[USER QUERY / FOCUS]\n${userPrompt}`;

            step3.className = "progress-step done";
            step3.textContent = "Step 3/4: Optimized evaluation prompt successfully compiled.";

            step4.style.display = "flex";
            step4.className = "progress-step active";
            step4.textContent = `Step 4/4: Connecting to Cloudflare Worker (${selectedModel === 'llama' ? 'Meta Llama Primary' : 'Gemini Secondary'})...`;

            const response = await fetch(WORKER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: combinedPrompt, model: selectedModel })
            });

            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`Server Error (${response.status}): ${errorText}`);
            }

            step4.className = "progress-step done";
            step4.textContent = "Step 4/4: Stream connected! Receiving live synthesis...";

            const reader = response.body.getReader();
            const decoder = new TextDecoder("utf-8");
            let partialBuffer = "";

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                partialBuffer += decoder.decode(value, { stream: true });
                const lines = partialBuffer.split("\n");
                partialBuffer = lines.pop();

                for (const line of lines) {
                    if (line.startsWith("data: ")) {
                        const dataStr = line.replace("data: ", "").trim();
                        if (dataStr === "[DONE]") continue;
                        try {
                            const json = JSON.parse(dataStr);
                            // Handle both Workers AI Llama format and Gemini format safely
                            const textChunk = json.response || json.candidates?.[0]?.content?.parts?.[0]?.text || "";
                            outputDiv.textContent += textChunk;
                        } catch (e) {
                            // Raw text or non-json SSE chunk handler if needed
                            if (dataStr) outputDiv.textContent += dataStr;
                        }
                    } else if (line.trim() && !line.startsWith(":")) {
                        // Handle raw chunk output if streaming directly
                        try {
                            const json = JSON.parse(line);
                            const textChunk = json.response || json.candidates?.[0]?.content?.parts?.[0]?.text || "";
                            outputDiv.textContent += textChunk;
                        } catch(e) {
                            outputDiv.textContent += line + "\n";
                        }
                    }
                }
            }

        } catch (error) {
            console.error("Gateway Call Failed:", error);
            document.querySelectorAll('.progress-step.active').forEach(el => {
                el.className = "progress-step";
            });
            outputDiv.className = "error-message";
            outputDiv.textContent = `Connection Failed: ${error.message}`;
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = "Run Synthesis";
        }
    }
</script>

</body>
</html>
