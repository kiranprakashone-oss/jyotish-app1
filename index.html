<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vedic Jyotish Analysis Engine</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --error-color: #f43f5e;
            --success-color: #10b981;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h1, h2 {
            margin: 0 0 12px 0;
            color: var(--accent-color);
        }

        label {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            display: block;
        }

        textarea, input[type="file"] {
            width: 100%;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            box-sizing: border-box;
            font-size: 1rem;
            margin-bottom: 12px;
        }

        textarea {
            height: 90px;
            padding: 10px;
            resize: vertical;
        }

        input[type="file"] {
            padding: 8px;
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: #0f172a;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: opacity 0.2s;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            font-size: 0.85rem;
            margin-top: 8px;
            padding: 8px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--success-color);
        }

        #output {
            white-space: pre-wrap;
            line-height: 1.5;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1>Vedic Jyotish Engine</h1>
        <div id="memoryStatus" class="status">Chart Memory: No chart data stored in session yet.</div>
    </div>

    <div class="card">
        <h2>1. Upload Planetary Chart Screenshot</h2>
        <label for="chartScreenshot">Provide a screenshot of your chart/planetary degrees:</label>
        <input type="file" id="chartScreenshot" accept="image/*">
        <button id="extractBtn" onclick="extractChartData()">Extract & Store Chart Data</button>
    </div>

    <div class="card">
        <h2>2. Chart Analysis Query</h2>
        <label for="prompt">Prompt Input (Synthesizes using stored chart memory)</label>
        <textarea id="prompt" placeholder="Enter query or specific transit/career/wealth focus..."></textarea>
        <button id="submitBtn" onclick="processQuery()">Run Synthesis</button>
    </div>

    <div class="card" id="resultCard" style="display: none;">
        <h2>Output Results</h2>
        <div id="output"></div>
    </div>
</div>

<script>
    const WORKER_URL = "https://jyotish-api-gateway.kiranprakashone.workers.dev";

    // Load stored chart context on startup if available
    window.onload = function() {
        const storedContext = sessionStorage.getItem('JYOTISH_CHART_CONTEXT');
        if (storedContext) {
            document.getElementById('memoryStatus').textContent = "Chart Memory: Active (Planetary degrees stored in session)";
        }
    };

    // Helper to convert uploaded image file to Base64
    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = error => reject(error);
        });
    }

    async function extractChartData() {
        const fileInput = document.getElementById('chartScreenshot');
        const extractBtn = document.getElementById('extractBtn');
        const outputDiv = document.getElementById('output');
        const resultCard = document.getElementById('resultCard');
        const memoryStatus = document.getElementById('memoryStatus');

        if (fileInput.files.length === 0) {
            alert("Please select or upload a chart screenshot image first.");
            return;
        }

        const file = fileInput.files[0];
        extractBtn.disabled = true;
        extractBtn.textContent = "Analyzing Screenshot & Extracting Degrees...";
        resultCard.style.display = "block";
        outputDiv.textContent = "Processing image through vision pipeline...";

        try {
            const base64Image = await fileToBase64(file);

            const extractionPrompt = "Analyze this Vedic Jyotish chart screenshot. Extract and list all exact planetary degrees, ascendant/Lagna position, house placements, and any relevant astrological details precisely. Format this clearly so it can serve as the foundational natal chart context for subsequent queries.";

            const response = await fetch(WORKER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    prompt: extractionPrompt,
                    image: {
                        inlineData: {
                            data: base64Image,
                            mimeType: file.type
                        }
                    }
                })
            });

            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`Server Error (${response.status}): ${errorText}`);
            }

            const data = await response.json();
            if (data.error) throw new Error(data.error);

            const extractedText = data.candidates?.[0]?.content?.parts?.[0]?.text || "Extraction completed.";
            
            // Store extracted chart context in browser session memory
            sessionStorage.setItem('JYOTISH_CHART_CONTEXT', extractedText);
            memoryStatus.textContent = "Chart Memory: Active (Planetary degrees stored in session)";
            
            outputDiv.textContent = "--- CHART DATA SUCCESSFULLY EXTRACTED & STORED IN MEMORY ---\n\n" + extractedText;

        } catch (error) {
            console.error("Extraction Failed:", error);
            outputDiv.textContent = `Error extracting chart screenshot: ${error.message}`;
        } finally {
            extractBtn.disabled = false;
            extractBtn.textContent = "Extract & Store Chart Data";
        }
    }

    async function processQuery() {
        const userPrompt = document.getElementById('prompt').value.trim();
        const submitBtn = document.getElementById('submitBtn');
        const outputDiv = document.getElementById('output');
        const resultCard = document.getElementById('resultCard');

        if (!userPrompt) {
            alert("Please provide input query parameters for analysis.");
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Synthesizing with Stored Chart Memory...";
        resultCard.style.display = "block";
        outputDiv.textContent = "Combining query with stored natal baseline...";

        try {
            // Retrieve stored chart context from session memory
            const storedChartContext = sessionStorage.getItem('JYOTISH_CHART_CONTEXT') || "No prior chart screenshot uploaded. Proceed using standard framework rules.";

            // Combine stored chart context with the user's active query prompt
            const combinedPrompt = `[NATAL CHART BASELINE MEMORY]\n${storedChartContext}\n\n[USER QUERY / FOCUS]\n${userPrompt}`;

            const response = await fetch(WORKER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: combinedPrompt })
            });

            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`Server Error (${response.status}): ${errorText}`);
            }

            const data = await response.json();
            if (data.error) throw new Error(data.error);

            const generatedText = data.candidates?.[0]?.content?.parts?.[0]?.text || JSON.stringify(data, null, 2);
            outputDiv.textContent = generatedText;

        } catch (error) {
            console.error("Gateway Call Failed:", error);
            outputDiv.textContent = `Network Notice: Cloud handshake restricted (${error.message}).`;
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = "Run Synthesis";
        }
    }
</script>

</body>
</html>
