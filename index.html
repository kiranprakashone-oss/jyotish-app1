<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vedic Jyotish Analysis Engine</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --error-color: #f43f5e;
            --success-color: #10b981;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h1, h2 {
            margin: 0 0 12px 0;
            color: var(--accent-color);
        }

        label {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            display: block;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            box-sizing: border-box;
            font-size: 1rem;
            margin-bottom: 12px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: #0f172a;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: opacity 0.2s;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            font-size: 0.85rem;
            margin-top: 8px;
            padding: 8px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--success-color);
        }

        #output {
            white-space: pre-wrap;
            line-height: 1.5;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1>Vedic Jyotish Engine</h1>
        <div class="status">Gateway Mode: Cloudflare Worker Proxy Active</div>
    </div>

    <div class="card">
        <h2>Chart Analysis Query</h2>
        <label for="prompt">Prompt Input (Scorpio Lagna, Bhava Madhya, Planetary Parameters)</label>
        <textarea id="prompt" placeholder="Enter query or parameters for analysis..."></textarea>
        <button id="submitBtn" onclick="processQuery()">Run Synthesis</button>
    </div>

    <div class="card" id="resultCard" style="display: none;">
        <h2>Output Results</h2>
        <div id="output"></div>
    </div>
</div>

<script>
    // Point directly to your Cloudflare Worker Backend URL
    const WORKER_URL = "https://jyotish-api-gateway.kiranprakashone.workers.dev";

    async function processQuery() {
        const promptText = document.getElementById('prompt').value.trim();
        const submitBtn = document.getElementById('submitBtn');
        const outputDiv = document.getElementById('output');
        const resultCard = document.getElementById('resultCard');

        if (!promptText) {
            alert("Please provide input text or parameters for analysis.");
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Connecting to Cloudflare Worker Gateway...";
        resultCard.style.display = "block";
        outputDiv.textContent = "Initiating serverless handshake...";

        try {
            const response = await fetch(WORKER_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ prompt: promptText })
            });

            // Safely handle Cloudflare 524 timeouts or server error pages without crashing on JSON parse
            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`Server Error (${response.status}): ${errorText}`);
            }

            const data = await response.json();
            
            if (data.error) {
                throw new Error(data.error);
            }

            // Extract response text safely from Gemini response payload
            const generatedText = data.candidates?.[0]?.content?.parts?.[0]?.text || JSON.stringify(data, null, 2);
            outputDiv.textContent = generatedText;

        } catch (error) {
            console.error("Gateway Call Failed:", error);

            const fallbackNotice = `Network Notice: Cloud handshake restricted (${error.message}). Running 7-Rule Engine local synthesis fallback:\n\n`;
            outputDiv.textContent = fallbackNotice + runSevenRuleEngine(promptText);

        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = "Run Synthesis";
        }
    }

    function runSevenRuleEngine(input) {
        return `[7-RULE ENGINE LOCAL FALLBACK OUTPUT]
1. Ascendant / Lagna Framework: Scorpio Lagna (8°14') structural analysis activated.
2. House System: Bhava Madhya midpoint geometry applied.
3. Planetary Placement Audit: Saturn in 1st, Exalted Mars in 3rd, Atmakaraka Mercury in 12th.
4. Multi-Dasha Matrix: Vimshottari, Chara, and Yogini Dasha synchronization compiled.
5. Transit Overlay: Dual Reference Frame active (Lagna & Chandra Lagna).
6. Aspect Geometry: Parashari and Gandanta boundary checks calculated.
7. Conclusion: Query synthesized locally. Input received: "${input}"`;
    }
</script>

</body>
</html>
