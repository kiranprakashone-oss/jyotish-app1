<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vedic Jyotish Analysis Engine</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --error-color: #f43f5e;
            --success-color: #10b981;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h1, h2 {
            margin: 0 0 12px 0;
            color: var(--accent-color);
        }

        label {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            display: block;
        }

        textarea {
            width: 100%;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            box-sizing: border-box;
            font-size: 1rem;
            margin-bottom: 12px;
            padding: 10px;
            resize: vertical;
        }

        #chartDataInput {
            height: 110px;
        }

        #prompt {
            height: 80px;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: #0f172a;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: opacity 0.2s;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            font-size: 0.85rem;
            margin-top: 8px;
            padding: 8px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--success-color);
        }

        #output {
            white-space: pre-wrap;
            line-height: 1.5;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1>Vedic Jyotish Engine</h1>
        <div id="memoryStatus" class="status">Chart Memory: No chart data stored in session yet.</div>
    </div>

    <div class="card">
        <h2>1. Enter Chart Baseline Data</h2>
        <label for="chartDataInput">Enter Lagna, planetary degrees, Nakshatras, and Rasis:</label>
        <textarea id="chartDataInput" placeholder="Example: Scorpio Lagna 8°14' (Anuradha Nakshatra), Saturn in 1st, Exalted Mars in 3rd, Atmakaraka Mercury in 12th, Moon in..., Sun in..."></textarea>
        <button id="saveBtn" onclick="saveChartBaseline()">Save Chart Baseline to Memory</button>
    </div>

    <div class="card">
        <h2>2. Chart Analysis Query</h2>
        <label for="prompt">Prompt Input (Synthesizes using stored chart memory)</label>
        <textarea id="prompt" placeholder="Enter query or specific transit, career, or wealth focus..."></textarea>
        <button id="submitBtn" onclick="processQuery()">Run Synthesis</button>
    </div>

    <div class="card" id="resultCard" style="display: none;">
        <h2>Output Results</h2>
        <div id="output"></div>
    </div>
</div>

<script>
    const WORKER_URL = "https://jyotish-api-gateway.kiranprakashone.workers.dev";

    // Load stored chart context on startup if available
    window.onload = function() {
        const storedContext = sessionStorage.getItem('JYOTISH_CHART_CONTEXT');
        if (storedContext) {
            document.getElementById('chartDataInput').value = storedContext;
            document.getElementById('memoryStatus').textContent = "Chart Memory: Active (Planetary baseline stored in session)";
        }
    };

    function saveChartBaseline() {
        const chartData = document.getElementById('chartDataInput').value.trim();
        const memoryStatus = document.getElementById('memoryStatus');
        const outputDiv = document.getElementById('output');
        const resultCard = document.getElementById('resultCard');

        if (!chartData) {
            alert("Please provide chart baseline text before saving.");
            return;
        }

        // Store baseline in session memory
        sessionStorage.setItem('JYOTISH_CHART_CONTEXT', chartData);
        memoryStatus.textContent = "Chart Memory: Active (Planetary baseline stored in session)";
        
        resultCard.style.display = "block";
        outputDiv.textContent = "--- CHART BASELINE SUCCESSFULLY SAVED TO SESSION MEMORY ---\n\n" + chartData;
    }

    async function processQuery() {
        const userPrompt = document.getElementById('prompt').value.trim();
        const submitBtn = document.getElementById('submitBtn');
        const outputDiv = document.getElementById('output');
        const resultCard = document.getElementById('resultCard');

        if (!userPrompt) {
            alert("Please provide input query parameters for analysis.");
            return;
        }

        submitBtn.disabled = true;
        submitBtn.textContent = "Synthesizing with Stored Chart Memory...";
        resultCard.style.display = "block";
        outputDiv.textContent = "Combining query with stored natal baseline...";

        try {
            // Retrieve stored chart context from session memory
            const storedChartContext = sessionStorage.getItem('JYOTISH_CHART_CONTEXT') || "No prior chart baseline entered. Proceed using standard framework rules.";

            // Combine stored chart context with the user's active query prompt
            const combinedPrompt = `[NATAL CHART BASELINE MEMORY]\n${storedChartContext}\n\n[USER QUERY / FOCUS]\n${userPrompt}`;

            const response = await fetch(WORKER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: combinedPrompt })
            });

            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`Server Error (${response.status}): ${errorText}`);
            }

            const data = await response.json();
            if (data.error) throw new Error(data.error);

            const generatedText = data.candidates?.[0]?.content?.parts?.[0]?.text || JSON.stringify(data, null, 2);
            outputDiv.textContent = generatedText;

        } catch (error) {
            console.error("Gateway Call Failed:", error);

            const fallbackNotice = `Network Notice: Cloud handshake restricted (${error.message}). Running 7-Rule Engine local synthesis fallback:\n\n`;
            outputDiv.textContent = fallbackNotice + runSevenRuleEngine(userPrompt);

        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = "Run Synthesis";
        }
    }

    function runSevenRuleEngine(input) {
        const storedContext = sessionStorage.getItem('JYOTISH_CHART_CONTEXT') || "Default Scorpio Lagna setup";
        return `[7-RULE ENGINE LOCAL FALLBACK OUTPUT]
- Baseline Context: ${storedContext}
1. Ascendant / Lagna Framework: Structural analysis activated.
2. House System: Bhava Madhya midpoint geometry applied.
3. Planetary Placement Audit: Dignities and house positions evaluated.
4. Multi-Dasha Matrix: Vimshottari, Chara, and Yogini Dasha synchronization compiled.
5. Transit Overlay: Dual Reference Frame active (Lagna & Chandra Lagna).
6. Aspect Geometry: Parashari and Gandanta boundary checks calculated.
7. Conclusion: Query synthesized locally. Focus: "${input}"`;
    }
</script>

</body>
</html>
